</style></head><body><header><div class="brand"><b>▰</b> TOURNAMENT <span style="color:#777">/</span> BRACKET</div><div class="topright"><span>8 TEAMS · SINGLE ELIMINATION</span><button class="admin" id="admin">관리자 로그인 ↗</button></div></header><main><div class="hero"><div><div class="eyebrow">● TOURNAMENT BRACKET / 2026</div><h1>THE ROAD<br>TO <span style="color:#d9ff46">VICTORY.</span></h1><p>8팀이 펼치는 토너먼트 · 경기 카드를 눌러 상세 정보를 확인하세요.</p></div><div class="stats"><div class="stat"><strong>08</strong><span>참가 팀</span></div><div class="stat"><strong>07</strong><span>총 경기</span></div><div class="stat"><strong id="done">00</strong><span>완료 경기</span></div></div></div><div class="legend"><span><b>●</b> TOURNAMENT OVERVIEW</span><span id="savedTime">경기를 선택해 상세 정보 보기 ↗</span></div><div class="bracket" id="bracket"></div></main><div class="footer">TOURNAMENT BRACKET &nbsp; / &nbsp; EVERY MATCH COUNTS</div><dialog id="modal"><div id="modalContent"></div></dialog><script>
const API_BASE = 'https://dphkpikqznoqtmlbmoyb.supabase.co/functions/v1/tournament-bracket-api';
const PUBLIC_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwaGtwaWtxem5vcXRtbGJtb3liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTgyODAsImV4cCI6MjExMDAzNDI4MH0.v7nGxnIEcv1DWzNoV25dcbrcpf9DAfHwcgBF_jsQFD8';
const publicHeaders={Authorization:'Bearer '+PUBLIC_KEY,apikey:PUBLIC_KEY};
const teams={1:['Langsamcale','란드'],2:['코큰놈','pig'],3:['NASA_SPACE','METAIN JI'],4:['NIGHTWELL','Enigma'],5:['무말랭이','빅터 나보스키'],6:['Cubic','양파'],7:['IIIIIIIII','호랎이'],8:['비비빅','JIIIHYUK']};const maps=['소나무 숲','Battle of the Sogg','Baseplate','Desert Storm V2','Chuva','Archipelago'];let data={},revision=null,updatedAt=null,pass='',current=1,editing=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pair=n=>n<=4?[[2,3],[1,4],[6,5],[7,8]][n-1]:n===5?[data[1]?.winner,data[2]?.winner]:n===6?[data[3]?.winner,data[4]?.winner]:[data[5]?.winner,data[6]?.winner];const name=id=>id&&teams[id]?teams[id].join(' / '):'진출 팀 미정';const status=n=>data[n]?.winner?'경기 완료':'예정';function render(){if(updatedAt) $('#savedTime').textContent='마지막 저장 · '+new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',dateStyle:'medium',timeStyle:'short'}).format(new Date(updatedAt))+' (한국 시간)';let rounds=[['QUARTERFINALS','8강전',[1,2,3,4]],['SEMIFINALS','4강전',[5,6]],['THE FINAL','결승전',[7]]];$('#done').textContent=String(Object.values(data).filter(x=>x.winner).length).padStart(2,'0');$('#admin').textContent=pass?'관리자 로그아웃 ↗':'관리자 로그인 ↗';$('#bracket').innerHTML=rounds.map(([en,ko,ns])=>`<section class="round"><div class="roundhead"><div><h2>${en}</h2><small>${ko}</small></div><small>0${ns.length} MATCH${ns.length>1?'ES':''}</small></div><div class="cards">${ns.map(n=>`<button class="card" onclick="openMatch(${n})"><div class="cardtop"><span>MATCH ${String(n).padStart(2,'0')}</span><span>${status(n)}</span></div>${pair(n).map(id=>`<div class="team ${id&&data[n]?.winner==id?'win':''} ${!id?'pending':''}"><span class="num">${id?'T'+String(id).padStart(2,'0'):'—'}</span><span class="names">${esc(name(id))}</span><span class="mark">${id&&data[n]?.winner==id?'WIN':''}</span></div>`).join('')}</button>`).join('')}</div></section>`).join('')}
function openMatch(n){current=n;editing=false;show();$('#modal').showModal()}function show(){let n=current,d=data[n]||{},p=pair(n);let field=(label,value)=>`<div class="field"><label>${label}</label><strong>${value||'미입력'}</strong></div>`;let title=`<div class="modalhead"><div><div class="eyebrow">${n<5?'QUARTERFINALS':n<7?'SEMIFINALS':'FINAL'} / 경기 상세</div><h2>MATCH ${String(n).padStart(2,'0')}</h2></div><button class="close" onclick="modal.close()" aria-label="닫기">×</button></div>`;let versus=`<div class="versus"><b>${esc(name(p[0]))}</b><span class="vs">VS</span><b>${esc(name(p[1]))}</b></div>`;let content;if(!editing){content=`<div class="fields">${field('승자',esc(d.winner?name(d.winner):''))}${field('패자',esc(d.winner?name(p.find(x=>x&&x!=d.winner)):''))}${[0,1].map(i=>field(`${esc(name(p[i]))} · 밴픽 유닛`,(d.units?.[i]||[]).filter(Boolean).map(x=>`<span class="unit">${esc(x)}</span>`).join(''))).join('')}${field('최종 턴',esc(d.turn))}${field('승리 방법',esc(d.method))}<div class="field full"><label>맵</label><strong>${esc(d.map||'미선택')}</strong>${d.map?`<img class="mapimg" src="maps/${maps.indexOf(d.map)}.jpeg" alt="${esc(d.map)}">`:''}</div></div><div class="actions">${pass?'<button class="btn primary" onclick="editing=true;show()">경기 정보 수정</button>':'<span class="hint">정보 수정은 관리자 로그인 후 가능합니다.</span>'}</div>`}else{content=`<form id="form"><div class="fields"><div class="field"><label>승자</label><select name="winner"><option value="">결과 미정</option>${p.filter(Boolean).map(id=>`<option value="${id}" ${d.winner==id?'selected':''}>${esc(name(id))}</option>`).join('')}</select></div><div class="field"><label>승리 방법</label><select name="method"><option value="">선택 안 함</option>${['항복','전멸'].map(x=>`<option ${d.method===x?'selected':''}>${x}</option>`).join('')}</select></div>${[0,1].map(i=>`<div class="field"><label>${esc(name(p[i]))} · 밴픽 유닛 3개</label>${[0,1,2].map(j=>`<input name="u${i}${j}" placeholder="유닛 ${j+1}" value="${esc(d.units?.[i]?.[j]||'')}" style="margin-bottom:6px">`).join('')}</div>`).join('')}<div class="field"><label>맵</label><select name="map" onchange="mapPreview(this.value)"><option value="">선택 안 함</option>${maps.map(x=>`<option ${d.map===x?'selected':''}>${esc(x)}</option>`).join('')}</select><img id="mapPreview" class="mapimg" ${d.map?`src="maps/${maps.indexOf(d.map)}.jpeg"`:'hidden'} alt="선택한 맵"></div><div class="field"><label>최종 턴</label><input name="turn" type="number" min="0" placeholder="턴 수" value="${esc(d.turn||'')}"></div></div><p class="hint">승자를 변경하면 연결된 다음 경기의 결과가 초기화됩니다.</p><p class="error" id="error"></p><div class="actions"><button type="button" class="btn" onclick="editing=false;show()">취소</button><button class="btn primary">저장하기</button></div></form>`}$('#modalContent').innerHTML=title+`<div class="modalbody">${versus}${content}</div>`;if(editing)$('#form').onsubmit=save}
function mapPreview(v){let e=$('#mapPreview');e.hidden=!v;if(v)e.src='maps/'+maps.indexOf(v)+'.jpeg'}async function save(e){e.preventDefault();let f=new FormData(e.target),n=current,p=pair(n),winner=Number(f.get('winner'))||null;if(winner&&(!p[0]||!p[1])){$('#error').textContent='두 진출 팀이 모두 정해진 후 승자를 선택해 주세요.';return}let next=structuredClone(data);let old=next[n]?.winner;next[n]={winner,method:f.get('method'),map:f.get('map'),turn:f.get('turn'),units:[0,1].map(i=>[0,1,2].map(j=>f.get('u'+i+j).trim()))};if(old!==winner){let child=n<=2?5:n<=4?6:n<=6?7:null;if(child){delete next[child];if(child!==7)delete next[7]}}try{let r=await fetch(API_BASE,{method:'PUT',headers:{...publicHeaders,'Content-Type':'application/json','X-Admin-Password':pass},body:JSON.stringify({revision,data:next})});if(!r.ok)throw Error(r.status===409?'다른 곳에서 정보가 변경되어 저장하지 않았습니다. 입력 내용을 확인한 후 새로고침해 다시 수정해 주세요.':r.status===401?'비밀번호가 올바르지 않습니다.':r.status===429?'로그인 시도가 너무 많습니다. 5분 후 다시 시도해 주세요.':'저장하지 못했습니다. 다시 시도해 주세요.');let saved=await r.json();data=saved.data;revision=saved.revision;updatedAt=saved.updated_at;editing=false;render();show()}catch(err){$('#error').textContent=err.message}}$('#admin').onclick=async()=>{if(pass){pass='';render();return}let p=prompt('관리자 비밀번호를 입력하세요.');if(p===null)return;try{let r=await fetch(API_BASE,{method:'POST',headers:{...publicHeaders,'X-Admin-Password':p}});if(!r.ok){alert(r.status===429?'로그인 시도가 너무 많습니다. 5분 후 다시 시도해 주세요.':'비밀번호가 올바르지 않습니다.');return}pass=p;render()}catch{alert('연결을 확인해 주세요.')}};fetch(API_BASE,{headers:publicHeaders}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{data=x.data;revision=x.revision;updatedAt=x.updated_at;render()}).catch(()=>{render();alert('경기 정보를 불러오지 못했습니다.')});render();
</script></body></html>
