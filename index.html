const API_BASE = 'https://dphkpikqznoqtmlbmoyb.supabase.co/functions/v1/tournament-bracket-api';
const PUBLIC_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwaGtwaWtxem5vcXRtbGJtb3liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTgyODAsImV4cCI6MjExMDAzNDI4MH0.v7nGxnIEcv1DWzNoV25dcbrcpf9DAfHwcgBF_jsQFD8';
const publicHeaders={Authorization:'Bearer '+PUBLIC_KEY,apikey:PUBLIC_KEY};
const teams={1:['Langsamcale','란드'],2:['코큰놈','pig'],3:['NASA_SPACE','METAIN JI'],4:['NIGHTWELL','Enigma'],5:['무말랭이','빅터 나보스키'],6:['Cubic','양파'],7:['IIIIIIIII','호랎이'],8:['비비빅','JIIIHYUK']};const maps=['소나무 숲','Battle of the Sogg','Baseplate','Desert Storm V2','Chuva','Archipelago'];let data={},revision=null,updatedAt=null,pass='',current=1,editing=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pair=n=>n<=4?[[2,3],[1,4],[6,5],[7,8]][n-1]:n===5?[data[1]?.winner,data[2]?.winner]:n===6?[data[3]?.winner,data[4]?.winner]:[data[5]?.winner,data[6]?.winner];const name=id=>id&&teams[id]?teams[id].join(' / '):'진출 팀 미정';const status=n=>data[n]?.winner?'경기 완료':'예정';function render(){let rounds=[['QUARTERFINALS','8강전',[1,2,3,4]],['SEMIFINALS','4강전',[5,6]],['THE FINAL','결승전',[7]]];$('#admin').textContent=pass?'로그아웃':'관리자';$('#bracket').innerHTML=rounds.map(([en,ko,ns])=>`<section class="round"><div class="roundhead"><h2>${ko}</h2></div><div class="cards">${ns.map(n=>`<button class="card" onclick="openMatch(${n})"><div class="cardtop"><span>${n}경기</span><span>${status(n)}</span></div>${pair(n).map(id=>`<div class="team ${id&&data[n]?.winner==id?'win':''} ${!id?'pending':''}"><span class="num">${id?'T'+String(id).padStart(2,'0'):'—'}</span><span class="names">${esc(name(id))}</span><span class="mark">${id&&data[n]?.winner==id?'WIN':''}</span></div>`).join('')}</button>`).join('')}</div></section>`).join('')}
function openMatch(n){current=n;editing=false;show();$('#modal').showModal()}function show(){let n=current,d=data[n]||{},p=pair(n);let field=(label,value)=>`<div class="field"><label>${label}</label><strong>${value||'미입력'}</strong></div>`;let title=`<div class="modalhead"><div><div class="eyebrow">${n<5?'QUARTERFINALS':n<7?'SEMIFINALS':'FINAL'} / 경기 상세</div><h2>${n}경기</h2></div><button class="close" onclick="modal.close()" aria-label="닫기">×</button></div>`;let versus=`<div class="versus"><b>${esc(name(p[0]))}</b><span class="vs">VS</span><b>${esc(name(p[1]))}</b></div>`;let content;if(!editing){content=`<div class="fields">${field('승자',esc(d.winner?name(d.winner):''))}${field('패자',esc(d.winner?name(p.find(x=>x&&x!=d.winner)):''))}${[0,1].map(i=>field(`${esc(name(p[i]))} · 밴픽 유닛`,(d.units?.[i]||[]).filter(Boolean).map(x=>`<span class="unit">${esc(x)}</span>`).join(''))).join('')}${field('최종 턴',esc(d.turn))}${field('승리 방법',esc(d.method))}<div class="field full"><label>맵</label><strong>${esc(d.map||'미선택')}</strong>${d.map?`<img class="mapimg" src="maps/${maps.indexOf(d.map)}.jpeg" alt="${esc(d.map)}">`:''}</div></div><div class="actions">${pass?'<button class="btn primary" onclick="editing=true;show()">경기 정보 수정</button>':''}</div>`}else{content=`<form id="form"><div class="fields"><div class="field"><label>승자</label><select name="winner"><option value="">결과 미정</option>${p.filter(Boolean).map(id=>`<option value="${id}" ${d.winner==id?'selected':''}>${esc(name(id))}</option>`).join('')}</select></div><div class="field"><label>승리 방법</label><select name="method"><option value="">선택 안 함</option>${['항복','전멸'].map(x=>`<option ${d.method===x?'selected':''}>${x}</option>`).join('')}</select></div>${[0,1].map(i=>`<div class="field"><label>${esc(name(p[i]))} · 밴픽 유닛 3개</label>${[0,1,2].map(j=>`<input name="u${i}${j}" placeholder="유닛 ${j+1}" value="${esc(d.units?.[i]?.[j]||'')}" style="margin-bottom:6px">`).join('')}</div>`).join('')}<div class="field"><label>맵</label><select name
